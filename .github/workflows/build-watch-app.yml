name: Build watch app

on:
  push:
    paths:
      - "watch-app/**"
      - ".github/workflows/build-watch-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        working-directory: watch-app
        run: chmod +x gradlew

      - name: Build and test
        working-directory: watch-app
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: stayawake-apk
          path: watch-app/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: watch-app/app/build/reports/tests/
